
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <header>
        <h1>Cadastro de Produtos</h1>
        <p>Gerenciamento de produtos e estoque</p>
    </header>

    <main>
        <section class="form-section">
            <h2>Cadastrar Produto</h2>

            <form id="produtoForm">
                <div class="form-group">
                    <label for="nome">Nome do Produto</label>
                    <input type="text" id="nome" required maxlength="120"
                           placeholder="Digite o nome do produto">
                </div>

                <div class="form-group">
                    <label for="categoria">Categoria</label>
                    <input type="text" id="categoria" required maxlength="80"
                           placeholder="Digite a categoria">
                </div>

                <div class="form-group">
                    <label for="preco">Preço (R$)</label>
                    <input type="number" id="preco" required
                           min="0.01" step="0.01"
                           placeholder="0.00">
                </div>

                <div class="form-group">
                    <label for="quantidade">Quantidade em Estoque</label>
                    <input type="number" id="quantidade" required
                           min="0" step="1"
                           placeholder="0">
                </div>

                <button type="submit" id="btnCadastrar">
                    Cadastrar Produto
                </button>
            </form>

            <div id="mensagem" role="status" aria-live="polite"></div>
        </section>

        <section class="products-section">
            <div class="products-header">
                <h2>Produtos Cadastrados</h2>
                <button type="button" id="btnListar">
                    Listar Todos os Produtos
                </button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Categoria</th>
                            <th>Preço</th>
                            <th>Quantidade</th>
                        </tr>
                    </thead>
                    <tbody id="listaProdutos">
                        <tr>
                            <td colspan="5">
                                Clique em "Listar Todos os Produtos"
                                para consultar o banco de dados.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>Projeto de Avaliação Prática de DevOps</p>
    </footer>

</body>
</html>
